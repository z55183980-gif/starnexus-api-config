name: T3

# 打包在 GitHub 的机器上跑，因为 macOS 包只能由 macOS 出：
# 编译要 Apple 的 SDK，打 DMG 要 hdiutil，签名要 codesign，都是 Mac 独有的。
on:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了，另一个照常出包，便于定位问题
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos
          - os: windows-2022
            label: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Intel 和 Apple Silicon 打进同一个包，用户不用挑
